<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="LegalMind AI - Your multilingual AI assistant.">
<meta name="google-site-verification" content="AP4wA721r_3w-0aCuumNtbdzvGyD6xQVtrbD0bWUZ4Q" />
  <title>LegalMind AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1020;--sidebar:#090e1c;--panel:#111a2e;--blue:#3b82f6;--purple:#8b5cf6;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(255,255,255,.09);--sidebar-width:270px}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 80% 10%,rgba(99,102,241,.15),transparent 40%),radial-gradient(ellipse at 20% 90%,rgba(59,130,246,.12),transparent 40%),var(--bg)}
button,textarea{font:inherit}.app{display:flex;width:100%;height:100dvh;overflow:hidden}
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);height:100%;display:flex;flex-direction:column;padding:22px 15px;background:rgba(7,12,25,.97);border-right:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:11px;padding:5px 8px 25px;font-size:21px;font-weight:800;letter-spacing:-.7px}.logo-icon,.welcome-icon,.message-avatar{display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--purple))}.logo-icon{width:39px;height:39px;border-radius:12px;font-size:20px}.logo span{color:#60a5fa}
.new-chat{width:100%;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid rgba(96,165,250,.35);border-radius:11px;color:white;background:linear-gradient(110deg,#2563eb,#6366f1);font-size:14px;font-weight:700;cursor:pointer;transition:.2s}.new-chat:hover{filter:brightness(1.15);transform:translateY(-1px)}
.sidebar-heading{margin:29px 9px 13px;color:#74829b;font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase}.history-list{flex:1;min-height:0;overflow-y:auto}.history-item{width:100%;display:flex;align-items:center;gap:9px;padding:11px 10px;margin-bottom:4px;border:0;border-radius:9px;background:transparent;color:#cbd5e1;font-size:12px;text-align:left;cursor:pointer}.history-item:hover,.history-item.active{background:#1b263b;color:white}.history-item span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty-history{padding:8px 10px;color:#64748b;font-size:12px;line-height:1.6}.sidebar-bottom{padding:16px 9px 3px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px}.sidebar-bottom strong{color:#60a5fa;font-size:12px}.sidebar-bottom small{color:#75839a;font-size:11px}
.chat-area{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}.topbar{height:64px;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 27px;border-bottom:1px solid var(--border);background:rgba(9,14,28,.55)}.topbar-title{font-size:14px;font-weight:700}.topbar-label{color:var(--muted);font-size:11px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:35px 24px 30px;scroll-behavior:smooth}.messages-inner{width:100%;max-width:900px;margin:0 auto}.welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 15px}.welcome-icon{width:65px;height:65px;margin-bottom:23px;border-radius:20px;box-shadow:0 10px 40px rgba(99,102,241,.25);font-size:29px}.welcome h1{margin-bottom:13px;font-size:clamp(25px,4vw,38px);letter-spacing:-1px}.welcome h1 span{color:#60a5fa}.welcome p{max-width:500px;color:var(--muted);font-size:14px;line-height:1.8}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:27px}.suggestion{padding:10px 14px;border:1px solid var(--border);border-radius:30px;background:rgba(255,255,255,.035);color:#cbd5e1;font-size:11px;cursor:pointer}.suggestion:hover{border-color:var(--blue);background:rgba(59,130,246,.1)}
.message{display:flex;gap:13px;margin-bottom:27px;animation:appear .25s ease}.message.user{justify-content:flex-end}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.message-content{max-width:min(88%,800px);padding:15px 18px;border-radius:16px;font-size:14px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}.message.user .message-content{max-width:min(82%,760px);background:linear-gradient(120deg,#2563eb,#4f46e5);color:white;border-bottom-right-radius:5px}.message.assistant .message-content{background:rgba(30,41,59,.72);border:1px solid var(--border);color:#e2e8f0;border-bottom-left-radius:5px}.message-avatar{width:34px;height:34px;min-width:34px;border-radius:10px;font-size:16px;align-self:flex-start}.message-tools{display:flex;gap:8px;margin-top:10px}.message-tools button{padding:5px 9px;border:1px solid var(--border);border-radius:7px;background:rgba(255,255,255,.04);color:#94a3b8;font-size:10px;cursor:pointer}.message-tools button:hover{color:white;background:rgba(255,255,255,.1)}
.thinking{display:flex;align-items:center;gap:6px;padding:10px 2px}.thinking span{width:7px;height:7px;border-radius:50%;background:#60a5fa;animation:pulse 1s infinite alternate}.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}@keyframes pulse{from{opacity:.3;transform:translateY(0)}to{opacity:1;transform:translateY(-5px)}}
.composer-area{flex-shrink:0;padding:13px 24px 16px;background:linear-gradient(to top,#0b1020 75%,rgba(11,16,32,.88))}.composer{width:100%;max-width:900px;margin:0 auto;padding:10px 12px 10px 18px;display:flex;align-items:flex-end;gap:12px;border:1px solid rgba(148,163,184,.22);border-radius:17px;background:#172238;box-shadow:0 8px 35px rgba(0,0,0,.25);transition:border .2s,box-shadow .2s}.composer:focus-within{border-color:rgba(96,165,250,.75);box-shadow:0 0 0 3px rgba(59,130,246,.1)}#question{flex:1;min-width:0;max-height:180px;min-height:44px;padding:11px 0;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:white;font-family:inherit;font-size:14px;line-height:1.6}#question::placeholder{color:#8290a8}.send-button{width:43px;height:43px;min-width:43px;display:grid;place-items:center;border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;font-size:20px;cursor:pointer;transition:.2s}.send-button:hover{filter:brightness(1.2)}.send-button:disabled{opacity:.5;cursor:wait}.composer-note{max-width:900px;margin:9px auto 0;color:#718096;font-size:10px;text-align:center}
.messages::-webkit-scrollbar,.history-list::-webkit-scrollbar,#question::-webkit-scrollbar{width:6px}.messages::-webkit-scrollbar-thumb,.history-list::-webkit-scrollbar-thumb{background:#34415a;border-radius:10px}
@media(max-width:700px){:root{--sidebar-width:68px}.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);padding:15px 7px;align-items:center}.logo{padding:0 0 23px}.logo-text,.sidebar-heading,.history-list,.sidebar-bottom,.new-chat-text{display:none}.new-chat{width:47px;height:45px;padding:0;font-size:21px}.topbar{padding:0 15px}.messages{padding:22px 13px}.message-content{max-width:88%;font-size:13px}.composer-area{padding:10px 12px 12px}.composer{padding-left:13px}.topbar-label{display:none}.welcome h1{font-size:27px}.suggestion{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-icon">⚖</div><div class="logo-text">LegalMind <span>AI</span></div></div>
    <button class="new-chat" id="newChatButton" type="button"><span>＋</span><span class="new-chat-text">New Chat</span></button>
    <div class="sidebar-heading">Your conversations</div>
    <div class="history-list" id="historyList"><p class="empty-history">Your conversations will appear here.</p></div>
    <div class="sidebar-bottom"><strong>LegalMind AI</strong><small>Multilingual AI Assistant · v3.1</small><small>Made by Jasurbek Komilov</small></div>
  </aside>
  <section class="chat-area">
    <header class="topbar"><div class="topbar-title">LegalMind AI</div><div class="topbar-label">Multilingual AI Assistant</div></header>
    <main class="messages" id="messages"><div class="messages-inner" id="messagesInner"></div></main>
    <footer class="composer-area">
      <div class="composer"><textarea id="question" rows="1" maxlength="6000" placeholder="Message LegalMind AI..."></textarea><button class="send-button" id="sendButton" type="button" title="Send message" aria-label="Send message">↑</button></div>
      <p class="composer-note">LegalMind AI can make mistakes. Verify important legal information with official sources.</p>
    </footer>
  </section>
</div>
<script>
const questionInput=document.getElementById('question');
const messages=document.getElementById('messages');
const messagesInner=document.getElementById('messagesInner');
const sendButton=document.getElementById('sendButton');
const newChatButton=document.getElementById('newChatButton');
const historyList=document.getElementById('historyList');
const STORAGE_KEY='legalmind_conversations_v3';
let conversations=loadConversations();
let currentChatId=null;
let isLoading=false;
function loadConversations(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(data)?data:[]}catch{return[]}}
function saveConversations(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(conversations.slice(0,50)))}catch(error){console.warn('Could not save conversations.',error)}}
function createId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function currentConversation(){return conversations.find(chat=>chat.id===currentChatId)}
function renderHistory(){historyList.innerHTML='';if(!conversations.length){const empty=document.createElement('p');empty.className='empty-history';empty.textContent='Your conversations will appear here.';historyList.appendChild(empty);return}conversations.forEach(chat=>{const button=document.createElement('button');button.className='history-item'+(chat.id===currentChatId?' active':'');button.type='button';const icon=document.createElement('span');icon.textContent='💬';const title=document.createElement('span');title.textContent=chat.title||'New conversation';button.append(icon,title);button.addEventListener('click',()=>openChat(chat.id));historyList.appendChild(button)})}
function scrollToBottom(){requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight})}
function showWelcome(){messagesInner.innerHTML='';const box=document.createElement('div');box.className='welcome';box.id='welcome';const icon=document.createElement('div');icon.className='welcome-icon';icon.textContent='⚖';const heading=document.createElement('h1');heading.append('How can I help ');const span=document.createElement('span');span.textContent='you today?';heading.appendChild(span);const paragraph=document.createElement('p');paragraph.textContent='Ask anything in Uzbek, English, or Russian. LegalMind AI can help with law, education, technology, business, science, and much more.';const suggestions=document.createElement('div');suggestions.className='suggestions';const examples=[['⚖ Uzbekistan law','O‘zbekiston qonunchiligida shartnoma qanday bekor qilinadi?'],['✦ Artificial intelligence','Explain artificial intelligence in simple terms.'],['📚 California law','Can a 17-year-old enter a contract in California?']];examples.forEach(([label,value])=>{const button=document.createElement('button');button.className='suggestion';button.type='button';button.textContent=label;button.addEventListener('click',()=>{questionInput.value=value;sendMessage()});suggestions.appendChild(button)});box.append(icon,heading,paragraph,suggestions);messagesInner.appendChild(box)}
function addMessage(role,content){const message=document.createElement('div');message.className='message '+role;if(role==='assistant'){const avatar=document.createElement('div');avatar.className='message-avatar';avatar.textContent='⚖';message.appendChild(avatar)}const contentBox=document.createElement('div');contentBox.className='message-content';const text=document.createElement('div');text.textContent=content;contentBox.appendChild(text);if(role==='assistant'){const tools=document.createElement('div');tools.className='message-tools';const copy=document.createElement('button');copy.type='button';copy.textContent='Copy';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(content);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy',1500)}catch{copy.textContent='Copy unavailable'}});tools.appendChild(copy);contentBox.appendChild(tools)}message.appendChild(contentBox);messagesInner.appendChild(message);scrollToBottom();return message}
function addThinking(){const message=document.createElement('div');message.className='message assistant';message.id='thinkingMessage';const avatar=document.createElement('div');avatar.className='message-avatar';avatar.textContent='⚖';const dots=document.createElement('div');dots.className='thinking';for(let i=0;i<3;i++)dots.appendChild(document.createElement('span'));message.append(avatar,dots);messagesInner.appendChild(message);scrollToBottom()}
function saveCurrentChat(){const chat=currentConversation();if(!chat)return;chat.updatedAt=new Date().toISOString();conversations=[chat,...conversations.filter(item=>item.id!==chat.id)].slice(0,50);saveConversations();renderHistory()}
function openChat(id){if(isLoading)return;const chat=conversations.find(item=>item.id===id);if(!chat)return;currentChatId=id;messagesInner.innerHTML='';if(!chat.messages||!chat.messages.length){showWelcome()}else{chat.messages.forEach(item=>addMessage(item.role,item.content))}renderHistory();scrollToBottom()}
function startNewChat(){if(isLoading)return;currentChatId=null;questionInput.value='';questionInput.style.height='auto';showWelcome();renderHistory();questionInput.focus()}
async function sendMessage(){if(isLoading)return;const question=questionInput.value.trim();if(!question){questionInput.focus();return}if(!currentChatId){currentChatId=createId();conversations.unshift({id:currentChatId,title:question.slice(0,55),messages:[],updatedAt:new Date().toISOString()})}const chat=currentConversation();if(!chat)return;const welcome=document.getElementById('welcome');if(welcome)welcome.remove();chat.messages.push({role:'user',content:question});if(!chat.title||chat.title==='New conversation')chat.title=question.slice(0,55);addMessage('user',question);questionInput.value='';questionInput.style.height='auto';isLoading=true;sendButton.disabled=true;addThinking();saveCurrentChat();try{const response=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const rawText=await response.text();let data;try{data=JSON.parse(rawText)}catch{throw new Error('The server returned an invalid response.')}if(!response.ok)throw new Error(data.error||'The AI service returned an error.');const answer=data.answer||'No answer was returned.';const thinking=document.getElementById('thinkingMessage');if(thinking)thinking.remove();chat.messages.push({role:'assistant',content:answer});addMessage('assistant',answer);saveCurrentChat()}catch(error){const thinking=document.getElementById('thinkingMessage');if(thinking)thinking.remove();const errorMessage='Sorry, an error occurred: '+error.message;chat.messages.push({role:'assistant',content:errorMessage});addMessage('assistant',errorMessage);saveCurrentChat()}finally{isLoading=false;sendButton.disabled=false;questionInput.focus()}}
sendButton.addEventListener('click',sendMessage);
newChatButton.addEventListener('click',startNewChat);
questionInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}});
questionInput.addEventListener('input',()=>{questionInput.style.height='auto';questionInput.style.height=Math.min(questionInput.scrollHeight,180)+'px'});
renderHistory();showWelcome();
</script>
</body>
</html>
